image:
  name: 'katalonstudio/katalon:11.1.3'
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"
  GS_OPTIONS: "-Xmx2048m -Xms512m -Djava.shm.size=2g"

cache:
  key: "apt-cache-v1"
  paths:
    - var/cache/apt/archives/

katalon_paj_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"

  before_script:

    # Clean report
    - rm -rf Reports/* || true
    - rm -rf Screenshot/* || true

    # Install ffmpeg jika belum ada
    - |
      if ! command -v ffmpeg &> /dev/null; then
        echo "FFmpeg not found, installing..."
        apt-get update -y && apt-get install -y --no-install-recommends ffmpeg
      else
        echo "FFmpeg is already installed."
      fi

    - ffmpeg -version

  script:

    - curl ifconfig.me

    - |

      ####################################################
      # Resolve Test Path
      ####################################################

      if [ -z "$TEST_PATH" ]; then
        echo "Running default PAJ Regression Collection..."
        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"
        export ARG_TYPE="-testSuiteCollectionPath"
      else
        echo "Running custom test: $TEST_PATH"
        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

      ####################################################
      # Chrome
      ####################################################

      echo "Starting Execution 1/2 : Chrome Headless"

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -orgID="$KATALON_ORG_ID" \
        -apiKey="$KATALON_API_KEY" \
        -retry=0 \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        || echo "Chrome tests completed."

      ####################################################
      # Firefox
      ####################################################

      echo "Starting Execution 2/2 : Firefox Headless"

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -orgID="$KATALON_ORG_ID" \
        -apiKey="$KATALON_API_KEY" \
        -retry=0 \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        || echo "Firefox tests completed."

    ####################################################
    # Cleanup
    ####################################################

    - echo "Cleaning old videos..."
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always
    paths:
      - Reports/
      - Screenshot/
    expire_in: 2 mos