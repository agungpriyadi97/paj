image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"

  # Memory Java
  GS_OPTIONS: "-Xms1024m -Xmx4096m -Djava.shm.size=4g"

  DISPLAY: ":99"

katalon_paj:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

  before_script:

    ###########################################
    # Clean
    ###########################################

    - rm -rf Reports || true
    - rm -rf Screenshot || true

    - mkdir -p Reports/Chrome
    - mkdir -p Reports/Firefox
    - mkdir -p Screenshot

    ###########################################
    # Install packages
    ###########################################

    - apt-get update -o Acquire::AllowInsecureRepositories=true || true

    - |
      apt-get install -y \
      xvfb \
      ffmpeg \
      curl \
      unzip \
      fonts-liberation \
      libatk-bridge2.0-0 \
      libgtk-3-0 \
      libgbm1 \
      libnss3 \
      libxss1 \
      libasound2 \
      || true

    ###########################################
    # Diagnostics
    ###########################################

    - java -version
    - google-chrome --version || true
    - chromedriver --version || true
    - firefox --version || true
    - geckodriver --version || true

    - curl -s ifconfig.me || true

    - ls -la

    - test -f "$CI_PROJECT_DIR/pasti-ada-jalan.prj"

  script:

    - |

      ###########################################
      # Resolve Test Suite
      ###########################################

      if [ -z "$TEST_PATH" ]; then

          FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"

          ARG_TYPE="-testSuiteCollectionPath"

      else

          FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)

          ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)

      fi

      ###########################################
      # Chrome
      ###########################################

      CHROME_EXIT=0

      echo ""
      echo "======================================="
      echo "Running Chrome Headless"
      echo "======================================="

      xvfb-run -a --server-args="-screen 0 1920x1080x24" \
      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Chrome (headless)" \
      -reportFolder="Reports/Chrome" \
      -reportFileName="Chrome_Report" \
      --config \
      -webui.autoUpdateDrivers=false \
      -webui.chrome.args="--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-extensions,--disable-background-networking,--disable-renderer-backgrounding,--disable-background-timer-throttling,--disable-sync,--window-size=1920,1080" \
      || CHROME_EXIT=$?

      ###########################################
      # Firefox
      ###########################################

      FIREFOX_EXIT=0

      echo ""
      echo "======================================="
      echo "Running Firefox Headless"
      echo "======================================="

      xvfb-run -a --server-args="-screen 0 1920x1080x24" \
      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Firefox" \
      -reportFolder="Reports/Firefox" \
      -reportFileName="Firefox_Report" \
      --config \
      -webui.autoUpdateDrivers=false \
      -webui.firefox.args="-headless" \
      || FIREFOX_EXIT=$?

      ###########################################
      # Summary
      ###########################################

      echo ""
      echo "======================================="
      echo "SUMMARY"
      echo "======================================="

      echo "Chrome Exit : $CHROME_EXIT"

      echo "Firefox Exit : $FIREFOX_EXIT"

      EXIT_CODE=0

      if [ "$CHROME_EXIT" -ne 0 ]; then
          EXIT_CODE=1
      fi

      if [ "$FIREFOX_EXIT" -ne 0 ]; then
          EXIT_CODE=1
      fi

      exit $EXIT_CODE

  after_script:

    - echo "Cleaning videos..."

    - find Reports -name "*.mp4" -mtime +30 -delete || true

  artifacts:

    when: always

    expire_in: 2 mos

    paths:
      - Reports/
      - Screenshot/

    reports:
      junit:
        - Reports/**/*.xml