image:
  name: ubuntu:24.04

stages:
  - test

variables:
  KATALON_VERSION: "11.1.3"
  GS_OPTIONS: "-Xmx4096m -Xms1024m -Djava.shm.size=4g"

katalon_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  before_script:
    - apt-get update

    - apt-get install -y \
        wget \
        unzip \
        curl \
        ffmpeg \
        xvfb \
        openjdk-21-jre \
        google-chrome-stable

    - mkdir -p /opt/katalon

    - wget -O katalon.zip https://download.katalon.com/${KATALON_VERSION}/Katalon_Studio_Engine_Linux_64-${KATALON_VERSION}.zip

    - unzip katalon.zip -d /opt/katalon

    - chmod +x /opt/katalon/katalonc

    - java -version

    - google-chrome --version

    - xvfb-run --version

    - mkdir -p Reports

    - mkdir -p Screenshot

  script:

    - |

      if [ -z "$TEST_PATH" ]; then
          FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"
          ARG_TYPE="-testSuiteCollectionPath"
      else
          FINAL_PATH=$(echo "$TEST_PATH"|cut -d= -f2)
          ARG_TYPE=$(echo "$TEST_PATH"|cut -d= -f1)
      fi

      echo "===== CHROME ====="

      xvfb-run -a /opt/katalon/katalonc \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Chrome (headless)" \
      -reportFolder="Reports/Chrome" \
      -reportFileName="Chrome_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -webui.chrome.args="--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080"

      echo "===== FIREFOX ====="

      xvfb-run -a /opt/katalon/katalonc \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Firefox (headless)" \
      -reportFolder="Reports/Firefox" \
      -reportFileName="Firefox_Report" \
      --config \
      -webui.autoUpdateDrivers=true

  artifacts:
    when: always

    paths:
      - Reports/
      - Screenshot/

    expire_in: 2 mos