image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  GS_OPTIONS: "-Xmx4096m -Xms1024m -Djava.shm.size=4g"

katalon_regression:

  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

  before_script:

    - echo "Cleaning previous reports..."
    - rm -rf Reports || true
    - rm -rf Screenshot || true

    - mkdir -p Reports
    - mkdir -p Screenshot

    - apt-get update -y || true
    - apt-get install -y ffmpeg xvfb || true

    - ffmpeg -version
    - google-chrome --version || true
    - firefox --version || true

  script:

    - |

      #############################################################
      # Resolve Test Path
      #############################################################

      if [ -z "$TEST_PATH" ]; then

          ARG_TYPE="-testSuiteCollectionPath"

          FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"

      else

          ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)

          FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)

      fi

      #############################################################
      # Browser
      #############################################################

      if [ -z "$BROWSER" ]; then
          BROWSER="Both"
      fi

      echo "=================================="
      echo "Project  : pasti-ada-jalan"
      echo "Browser  : $BROWSER"
      echo "Profile  : ${EXECUTION_PROFILE:-Development}"
      echo "Arg Type : $ARG_TYPE"
      echo "Path     : $FINAL_PATH"
      echo "=================================="

      #############################################################
      # Chrome
      #############################################################

      if [ "$BROWSER" = "Chrome" ] || [ "$BROWSER" = "Both" ]; then

        echo ""
        echo "========== Chrome =========="

        katalonc.sh \
          -noSplash \
          -runMode=console \
          -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
          -retry=0 \
          -orgID="$KATALON_ORG_ID" \
          -apiKey="$KATALON_API_KEY" \
          "$ARG_TYPE=$FINAL_PATH" \
          -executionProfile="${EXECUTION_PROFILE:-Development}" \
          -browserType="Chrome (headless)" \
          -reportFolder="Reports/Chrome_Reports" \
          -reportFileName="Chrome_Report" \
          --config \
          -webui.autoUpdateDrivers=true \
          -webui.chrome.args="--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080,--disable-blink-features=AutomationControlled" \
          || echo "Chrome execution finished."

      fi

      #############################################################
      # Firefox
      #############################################################

      if [ "$BROWSER" = "Firefox" ] || [ "$BROWSER" = "Both" ]; then

        echo ""
        echo "========== Firefox =========="

        katalonc.sh \
          -noSplash \
          -runMode=console \
          -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
          -retry=0 \
          -orgID="$KATALON_ORG_ID" \
          -apiKey="$KATALON_API_KEY" \
          "$ARG_TYPE=$FINAL_PATH" \
          -executionProfile="${EXECUTION_PROFILE:-Development}" \
          -browserType="Firefox (headless)" \
          -reportFolder="Reports/Firefox_Reports" \
          -reportFileName="Firefox_Report" \
          --config \
          -webui.autoUpdateDrivers=true \
          || echo "Firefox execution finished."

      fi

      #############################################################
      # Cleanup Old Videos
      #############################################################

      find Reports -type f -name "*.mp4" -mtime +30 -delete || true

  artifacts:
    when: always
    expire_in: 2 months
    paths:
      - Reports/
      - Screenshot/


cache:
  key: katalon-cache
  paths:
    - Drivers/

after_script:
  - echo ""
  - echo "======================================="
  - echo "Automation Finished"
  - echo "======================================="