image:
  name: 'katalonstudio/katalon:11.1.3'
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"
  GS_OPTIONS: "-Xmx2048m -Xms512m -Djava.shm.size=2g"

katalon_paj_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  before_script:
    # Cleanup report sebelumnya
    - rm -rf Reports/* || true
    - rm -rf Screenshot/* || true

    # Install ffmpeg
    - apt-get update -o Acquire::AllowInsecureRepositories=true -o Doomsday::Ignore=true -y || true
    - apt-get install -y --allow-unauthenticated ffmpeg
    - ffmpeg -version

  script:
    - curl ifconfig.me

    - |

      ###################################################
      # PAJ PATH RESOLUTION
      ###################################################

      if [ -z "$TEST_PATH" ]; then
        echo "Running default PAJ Regression Collection..."

        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"

        export ARG_TYPE="-testSuiteCollectionPath"

      else

        echo "Running custom test : $TEST_PATH"

        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)

        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)

      fi

      ###################################################
      # Chrome
      ###################################################

      echo "======================================"
      echo "Chrome Headless"
      echo "======================================"

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        || echo "Chrome execution finished."

      ###################################################
      # Firefox
      ###################################################

      echo "======================================"
      echo "Firefox Headless"
      echo "======================================"

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        || echo "Firefox execution finished."

    # Cleanup video lama
    - echo "Cleaning old videos..."
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always

    paths:
      - Reports/
      - Screenshot/

    expire_in: 2 mos