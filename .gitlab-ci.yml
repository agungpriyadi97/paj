image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  GS_OPTIONS: "-Xmx4096m -Xms1024m -Djava.shm.size=4g"

katalon_pasti_ada_jalan_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

  before_script:
    # Cleanup old reports
    - rm -rf Reports/* || true

    # Create folders if missing
    - mkdir -p Reports
    - mkdir -p Screenshot

    # Install dependencies
    - apt-get update || true
    - apt-get install -y xvfb ffmpeg curl || true

    # Diagnostics
    - ffmpeg -version || true
    - xvfb-run --version || true

    # Show runner IP (optional)
    - curl -s ifconfig.me || echo "Unable to retrieve public IP"

    # Verify project file exists
    - ls -la
    - test -f "$CI_PROJECT_DIR/pasti-ada-jalan.prj"

  script:
    - |
      echo "===================================="
      echo "PAJ AUTOMATION EXECUTION STARTED"
      echo "===================================="

      if [ -z "$TEST_PATH" ]; then
        echo "Running default regression suite collection"

        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_pasti_ada_jalan_Web"
        export ARG_TYPE="-testSuiteCollectionPath"
      else
        echo "Running custom execution: $TEST_PATH"

        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

      echo "Execution Path:"
      echo "$ARG_TYPE=$FINAL_PATH"

      echo "===================================="
      echo "CHROME HEADLESS EXECUTION"
      echo "===================================="

      mkdir -p Reports/Chrome_Reports

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
      || echo "Chrome execution completed with failures"

      echo "===================================="
      echo "FIREFOX HEADLESS EXECUTION"
      echo "===================================="

      firefox --version || true
      geckodriver --version || true

      mkdir -p Reports/Firefox_Reports

      xvfb-run -a --server-args="-screen 0 1920x1080x24" \
      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/pasti-ada-jalan.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        -webui.firefox.args="-headless" \
        -webui.firefox.additionalArgs="--width=1920 --height=1080" \
      || echo "Firefox execution completed with failures"

      echo "===================================="
      echo "REPORT VALIDATION"
      echo "===================================="

      find Reports -type f | head -50 || true

      if [ -d "Reports/Chrome_Reports" ]; then
        echo "Chrome reports generated"
      fi

      if [ -d "Reports/Firefox_Reports" ]; then
        echo "Firefox reports generated"
      fi

      echo "===================================="
      echo "EXECUTION FINISHED"
      echo "===================================="

    # Cleanup old videos
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always

    paths:
      - Reports/
      - Screenshot/

    reports:
      junit:
        - Reports/**/*.xml

    expire_in: 2 mos